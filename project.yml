name: Mogu
options:
  bundleIdPrefix: jp.rikuto
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Mogu.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: jp.rikuto.mogu
targets:
  Mogu:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Art/AppIcon.icns
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Mogu
    scheme:
      buildImplicitDependencies: YES
